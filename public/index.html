<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardápio Pro V10 - Painel</title>
<style>

*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#202124}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#17191d}
.login-box{width:100%;max-width:380px;background:#fff;border-radius:14px;padding:28px;box-shadow:0 8px 30px #0005}
.login-box h1{margin:0 0 8px;text-align:center}.login-box p{text-align:center;color:#777}
.login-box input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
.login-box button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:8px;background:#39c58a;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
#error{display:none;color:#c62828;text-align:center;margin-top:10px;font-size:14px}
#app{display:none}.layout{display:flex;min-height:100vh}.sidebar{width:230px;background:#17191d;color:#fff;padding:22px 15px}
.logo{font-size:22px;font-weight:700;margin:0 10px 25px}.logo span{color:#39c58a}
.menu button{display:block;width:100%;border:0;background:transparent;color:#c9ccd1;text-align:left;padding:13px;border-radius:9px;margin:5px 0;font-size:15px;cursor:pointer}
.menu button:hover,.menu button.active{background:#2a2e35;color:#fff}.main{flex:1;padding:25px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{font-size:25px}
.user,.card,.panel{background:#fff;border-radius:12px;box-shadow:0 2px 12px #0001}.user{padding:10px 14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.card{padding:20px}.card small{color:#777}.number{font-size:28px;font-weight:700;margin-top:8px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel{padding:20px}.panel h2{font-size:18px;margin-top:0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid #eee;font-size:14px}th{color:#777}
.status{padding:5px 9px;border-radius:20px;background:#e7f8ef;color:#16824f;font-size:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{padding:13px;border:1px solid #ddd;background:#fafafa;border-radius:8px;cursor:pointer}
@media(max-width:850px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
@media(max-width:600px){.layout{display:block}.sidebar{width:auto}.main{padding:15px}.cards{grid-template-columns:1fr}}

</style>
</head>
<body>
<div id="app">
<div class="layout">
<aside class="sidebar">
<div class="logo">Cardápio <span>Pro</span></div>
<nav class="menu">
<button class="active" onclick="showPage('Dashboard',this)">📊 Dashboard</button>
<button onclick="showPage('Pedidos',this)">🧾 Pedidos</button>
<button onclick="showPage('Produtos',this)">🍔 Produtos</button>
<button onclick="showPage('Categorias',this)">📁 Categorias</button>
<button onclick="showPage('Clientes',this)">👥 Clientes</button>
<button onclick="showPage('Configurações',this)">⚙️ Configurações</button>
</nav>
</aside>
<main class="main">
<div class="top"><h1 id="title">Dashboard</h1><div class="user">Administrador</div></div>
<section id="dashboard">
<div class="cards">
<div class="card"><small>Pedidos hoje</small><div class="number">24</div></div>
<div class="card"><small>Faturamento</small><div class="number">R$ 1.248</div></div>
<div class="card"><small>Produtos</small><div class="number">58</div></div>
<div class="card"><small>Clientes</small><div class="number">136</div></div>
</div>
<div class="grid">
<div class="panel"><h2>Pedidos recentes</h2>
<table><tr><th>Pedido</th><th>Cliente</th><th>Valor</th><th>Status</th></tr>
<tr><td>#1024</td><td>João</td><td>R$ 58,90</td><td><span class="status">Pago</span></td></tr>
<tr><td>#1023</td><td>Maria</td><td>R$ 42,00</td><td><span class="status">Pago</span></td></tr>
<tr><td>#1022</td><td>Pedro</td><td>R$ 76,50</td><td><span class="status">Pago</span></td></tr>
</table></div>
<div class="panel"><h2>Ações rápidas</h2><div class="quick">
<button>+ Produto</button><button>+ Pedido</button><button>🍔 Cardápio</button><button>⚙️ Configurar</button>
</div></div>
</div>
</section>
<section id="other" class="panel" ><h2 id="otherTitle"></h2><p>Área pronta para você adicionar sua lógica e banco de dados.</p></section>
</main>
</div>
</div>


<script>
async function sair(){
  await fetch('/api/logout', {method:'POST', credentials:'same-origin'});
  location.href='/login.html';
}
</script>
</body>
</html>
